name: iPad save and recovery gate
on:
  push:
    branches: [codex/v3-adventure-build, codex/touch-interactions]
  pull_request:
    branches: [release/ipad, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ipad-save-safety-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  home-review-materials:
    name: Home review materials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/package-home-review.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: home-exterior-review
          path: work/home-review-materials/
          if-no-files-found: error
          retention-days: 30
  save-and-recovery:
    name: ${{ github.event_name == 'pull_request' && 'save-and-recovery' || 'save-and-recovery-development' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          # The avatar preservation test renders the approved historical source.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: docker pull postgres:17-alpine
      - name: Migration, requests, offline recovery, purchases, roles and gameplay
        run: npm run test:ipad-release
      - name: Production build and guide portraits with fictional intercepted data
        run: |
          npm run test:production-build
          npm run test:staging-build
          npx playwright test -c playwright.production.config.cjs
          npx playwright test -c playwright.production-portraits.config.cjs
          GUIDE_BUILD=live npx playwright test -c playwright.production-portraits.config.cjs
      - name: Starting profile, family onboarding and characters (fictional only)
        run: |
          npm test
          npx playwright test -c playwright.starting-profile.config.cjs
          npx playwright test -c playwright.family-release.config.cjs
          AVATAR_SHOTS=work/family-release/avatar-shots AVATAR_REPORT=work/family-release/avatar-preservation.json npx playwright test -c playwright.avatar-fit.config.cjs --grep 'option zero'
      - name: Home exterior routing in private and isolated demo builds
        run: npm run test:home
      - name: Small-screen cooking controls and progress recovery in both builds
        run: npm run test:cooking-recovery

      - name: Single area maps and saved repair stages in both builds
        run: npm run test:area-maps
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ipad-save-recovery-evidence
          path: |
            work/area-maps/
            test-results/area-maps/
            work/home-exterior/
            test-results/home-exterior/
            work/cooking-recovery/
            test-results/cooking-recovery/
            work/family-release/avatar-preservation.json
            test-results/avatar-fit/
            work/family-release/browser-results.json
            test-results/family-release/
            work/starting-profile/browser-results.json
            test-results/starting-profile/
            tests/artifacts/compact-receipts-db.json
            tests/artifacts/save-recovery-browser.json
            test-results/save-recovery/
            test-results/production-browser/
            test-results/production-portraits/
            work/production-portraits/browser-results.json
            work/production-portraits/live-results.json
            test-results/live-portraits/
            tests/artifacts/v5-2-production-browser.json
          retention-days: 14
