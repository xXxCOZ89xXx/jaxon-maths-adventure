name: V3 isolated offline QA
on:
  pull_request:
    paths:
      - "v3/**"
      - "supabase/v3-staging/**"
      - "scripts/**"
      - "v3-adventure.html"
      - "v2-*.js"
      - "tests/**"
      - "package*.json"
      - "playwright.config.cjs"
      - ".github/workflows/v3-offline-qa.yml"
  push:
    branches: ["codex/v3-adventure-build"]
    paths:
      - "v3/**"
      - "supabase/v3-staging/**"
      - "scripts/**"
      - "v3-adventure.html"
      - "v2-*.js"
      - "tests/**"
      - "package*.json"
      - "playwright.config.cjs"
      - ".github/workflows/v3-offline-qa.yml"
concurrency:
  group: v3-qa-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  fictional-learner-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium webkit
      - name: Offline logic and compatibility
        run: npm test
      - name: Real PostgreSQL security and migration checks
        run: |
          docker pull postgres:17-alpine
          npm run test:security
      - name: Fictional desktop and touch gameplay
        run: npm run test:e2e
        env:
          V3_WEBKIT: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v3-fictional-qa
          path: |
            tests/artifacts/
            test-results/
          retention-days: 14

      - name: Package isolated playable preview
        run: npm run build:preview
      - uses: actions/upload-artifact@v4
        with:
          name: v3-offline-playable-preview
          path: preview-dist/
          retention-days: 30
