name: Isolated synthetic environment
on:
  pull_request:
    branches: [release/ipad]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-environment:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: docker pull postgres:17-alpine
      - run: npx playwright install --with-deps chromium
      - name: Verify project/build isolation and local SQL contracts
        run: npm run test:synthetic && npm run test:synthetic-baseline
      - name: Verify guarded Main package with fictional PostgreSQL only
        run: npm run test:main-history-preservation && node tests/main-history-native.cjs
      - name: Verify browser sessions, queues and fail-closed identity
        run: npm run test:synthetic-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-environment-evidence
          path: |
            tests/artifacts/synthetic-environment-browser.json
            tests/artifacts/synthetic-baseline-verification.json
            tests/artifacts/main-history-preservation-verification.json
            tests/artifacts/main-history-native-verification.json
            test-results/synthetic-environment/
          retention-days: 14
