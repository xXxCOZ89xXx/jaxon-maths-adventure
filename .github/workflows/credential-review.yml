name: Credential history review
on:
  pull_request:
    branches: [release/ipad]
permissions:
  contents: read
jobs:
  credential-history:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify classifier refuses changed candidates and incomplete scans
        run: node tests/credential-review.cjs
      - name: Download fixed verified Gitleaks release
        run: |
          curl --fail --location --retry 2 --output /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          mkdir -p /tmp/esa-gitleaks
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp/esa-gitleaks gitleaks
      - name: Scan all fetched history and merge diffs with redacted output
        run: |
          mkdir -p work/credential-review
          touch /tmp/esa-empty-ignore
          set +e
          env -u GITLEAKS_CONFIG -u GITLEAKS_CONFIG_TOML /tmp/esa-gitleaks/gitleaks git --log-opts='--all -m' --redact=100 --ignore-gitleaks-allow --gitleaks-ignore-path /tmp/esa-empty-ignore --no-banner --no-color --report-format=json --report-path=/tmp/esa-raw-findings.json --timeout=300 . > work/credential-review/scan.log 2>&1
          scan_exit=$?
          set -e
          if [ "$scan_exit" -gt 1 ]; then echo 'Credential scanner failed'; exit 1; fi
          node -e 'const fs=require("node:fs");const keys=["RuleID","File","Commit","StartLine","EndLine","StartColumn","EndColumn","Fingerprint"];const raw=JSON.parse(fs.readFileSync("/tmp/esa-raw-findings.json","utf8"));fs.writeFileSync("work/credential-review/redacted.json",JSON.stringify(raw.map(f=>Object.fromEntries(keys.filter(k=>k in f).map(k=>[k,f[k]]))),null,2));'
          node scripts/review-credential-scan.cjs work/credential-review/redacted.json work/credential-review/scan.log work/credential-review/summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: credential-review-evidence
          path: work/credential-review/
          retention-days: 14
