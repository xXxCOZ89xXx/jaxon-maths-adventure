<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#103322"><title>Jaxon's Maths Adventure · PIN screen preview</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#f1fff5;background:#0d1f19}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#285c40,#0d1f19 68%);padding:16px;display:grid;place-items:center}.panel{width:min(100%,420px);border:2px solid #438d61;border-radius:25px;padding:22px;background:#162d23;box-shadow:0 20px 70px #020d07a6;text-align:center}h1{margin:4px 0;font-size:29px}p{color:#bcd9c7;line-height:1.5}button{font:inherit;border:0;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:4px solid #f4d771;outline-offset:3px}.switch{display:flex;gap:8px;margin:18px 0}.switch button{flex:1;border:2px solid #537761;background:#234335;color:white;border-radius:12px;padding:13px}.switch button[aria-pressed=true]{border-color:#72e5a2;background:#285d3e}.dots{display:flex;justify-content:center;gap:12px;min-height:30px;margin:21px 0}.dot{height:19px;width:19px;border:2px solid #9ed8b4;border-radius:50%}.dot.filled{background:#61dd8c}.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px auto;max-width:320px}.keys button{min-height:65px;border-radius:17px;background:#2c6946;color:#fff;font-size:27px;font-weight:800}.keys button:active{background:#4eaa6f;transform:scale(.97)}.keys button.secondary{background:#294038;font-size:16px}.status{min-height:52px;font-weight:700;color:#d2eadd}.disclaimer{font-size:12px;border-top:1px solid #42634b;padding-top:15px}#error{color:#ffd997}#ok{color:#8df1b2}
</style></head><body><main class="panel"><div style="font-size:48px">🌲</div><h1>Jaxon's Maths Adventure</h1><p>Enter your PIN to start exploring</p><div class="switch" aria-label="Choose profile"><button id="learner" aria-pressed="true">🎮 Jaxon</button><button id="parent" aria-pressed="false">🛡️ Parent</button></div><h2 id="heading">Jaxon's 4-digit PIN</h2><div id="dots" class="dots" aria-label="0 digits entered"></div><div class="keys" id="keys"></div><div class="status" aria-live="polite" id="status">Choose a number</div><p class="disclaimer">Design preview only — this screen does not authenticate users or award rewards. Secure PIN verification will be enabled after separate Supabase accounts are configured.</p></main><script>
(()=>{'use strict';let role='learner',entry='';const by=id=>document.getElementById(id);function render(){const n=role==='learner'?4:6;by('heading').textContent=role==='learner'?"Jaxon's 4-digit PIN":"Parent's 6-digit PIN";by('dots').innerHTML=Array.from({length:n},(_,i)=>'<span class="dot '+(i<entry.length?'filled':'')+'"></span>').join('');by('dots').setAttribute('aria-label',entry.length+' of '+n+' digits entered');by('learner').setAttribute('aria-pressed',String(role==='learner'));by('parent').setAttribute('aria-pressed',String(role==='parent'))}function key(k){if(k==='clear'){entry='';by('status').textContent='PIN cleared'}else if(k==='back'){entry=entry.slice(0,-1);by('status').textContent=''}else if(entry.length<(role==='learner'?4:6)){entry+=k;if(entry.length===(role==='learner'?4:6)){by('status').textContent='Preview complete. A real login will verify your PIN securely.';entry='';setTimeout(render,0)}}render()}by('keys').innerHTML=[1,2,3,4,5,6,7,8,9,'clear',0,'back'].map(k=>'<button type="button" data-key="'+k+'" class="'+(typeof k==='number'?'':'secondary')+'" aria-label="'+(k==='clear'?'Clear PIN':k==='back'?'Delete last digit':k)+'">'+(k==='clear'?'Clear':k==='back'?'⌫':k)+'</button>').join('');by('keys').addEventListener('click',e=>{const b=e.target.closest('button[data-key]');if(b)key(b.dataset.key)});for(const v of ['learner','parent'])by(v).addEventListener('click',()=>{role=v;entry='';by('status').textContent='Choose a number';render()});render()})();
</script></body></html>
